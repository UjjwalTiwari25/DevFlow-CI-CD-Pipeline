name: CD

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Trigger Render deploy hook
        run: |
          echo "🚀 Triggering deployment for commit ${{ github.event.workflow_run.head_sha }}"
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          if [ "$response" != "200" ] && [ "$response" != "201" ]; then
            echo "❌ Deploy hook returned HTTP $response"
            exit 1
          fi
          echo "✅ Deploy hook triggered successfully"

      - name: Wait for deployment health check
        run: |
          echo "⏳ Waiting for deployment to become healthy..."
          for i in $(seq 1 20); do
            echo "  Attempt $i/20..."
            status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_HEALTH_URL }}" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ Service is healthy!"
              exit 0
            fi
            echo "  Status: $status — waiting 15s..."
            sleep 15
          done
          echo "❌ Health check failed after 5 minutes"
          exit 1

      - name: Notify Slack — Success
        if: success()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *Deployment Succeeded*\n*Commit:* `${{ github.event.workflow_run.head_sha }}`\n*Branch:* `main`\n*Triggered by:* ${{ github.event.workflow_run.actor.login }}"
                  }
                }
              ]
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

      - name: Notify Slack — Failure
        if: failure()
        run: |
          curl -s -X POST -H 'Content-type: application/json' \
            --data '{
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "❌ *Deployment Failed*\n*Commit:* `${{ github.event.workflow_run.head_sha }}`\n*Branch:* `main`\n*Action needed:* Check logs and consider rollback"
                  }
                }
              ]
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}" || true

  rollback:
    name: Rollback (Manual Trigger)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Trigger Render rollback
        run: |
          echo "🔄 Rolling back deployment..."
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/rollback"
          echo "✅ Rollback initiated"
